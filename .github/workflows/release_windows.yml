name: Release Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          arch: 'win64_msvc2019_64'
          cache: true

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt DLLs
        shell: cmd
        run: windeployqt build\Release\Sim8086.exe

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build\Release\* -DestinationPath Sim8086-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sim8086-Windows
          path: Sim8086-Windows.zip

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Sim8086-Windows.zip
